server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API (mesmo origin: o cookie de sessão é SameSite=Strict e não precisa de CORS).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Fixo em https: o navegador fala http com o nginx (demo local), mas a API emite
        # cookie Secure e não redireciona. Chrome e Firefox aceitam Secure em http://localhost.
        proxy_set_header X-Forwarded-Proto https;

        # SSE: sem buffering e com leitura longa.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Arquivos com hash do Vite podem ser cacheados.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer outra rota volta para o index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
